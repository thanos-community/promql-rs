# The promqltest evals this engine is expected to pass.
#
# Everything named here MUST keep passing. Removing an entry deletes
# coverage — that is a code-review question, not a way to make CI green.
#
# A file is either "all" -- every eval in it, including ones a future
# upstream bump adds, which an explicit list cannot bind -- or a list of
# case ids. Regenerate with:
#
#   PROMQL_PROMQLTEST_BLESS=1 cargo test -p promql-conformance --test promqltest
#
# Blessing keeps a file's "all" form, because that is a deliberate human
# choice, and only downgrades it if the file stops passing in full. It
# does NOT keep comments you add below: this is written through serde, so
# put any rationale in the commit message instead.
#
# Everything else in the corpus still runs — it just is not gated. See
# UNSUPPORTED.md for what is missing, or run with PROMQL_PROMQLTEST_ALL=1.

