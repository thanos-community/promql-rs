[workspace]
resolver = "2"
members = ["promql-parser", "promql-sync"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
cfgrammar = "0.13"
clap = { version = "4.5", features = ["derive"] }
insta = { version = "1", features = ["filters"] }
lrlex = "0.13"
lrpar = "0.13"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
