[workspace]
resolver = "2"
members = [
    "promql-conformance",
    "promql-engine",
    "promql-parser",
    "promql-sync",
    "promql-testcases",
    "thanos-query-rs",
    "thanos-store",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
cfgrammar = "0.13"
clap = { version = "4.5", features = ["derive"] }
# Engine code reaches Arrow only through `datafusion::arrow`, never a
# direct `arrow` dependency: a consumer that patches DataFusion to a fork
# would otherwise end up with two Arrows and a type mismatch at the seam.
datafusion = "54"
insta = { version = "1", features = ["filters"] }
lrlex = "0.13"
lrpar = "0.13"
prost = "0.14"
prost-types = "0.14"
# Pure-Rust protobuf compiler: the Thanos protos build without protoc.
protox = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
# Client side only by default; the `server` and `router` features are
# switched on by thanos-store's `testutil` feature for the fake store.
tonic = { version = "0.14", default-features = false, features = [
    "channel",
    "codegen",
] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
