[workspace]
resolver = "2"
members = ["promql-engine", "promql-parser", "promql-sync", "promql-testcases"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
cfgrammar = "0.13"
clap = { version = "4.5", features = ["derive"] }
# Engine code reaches Arrow only through `datafusion::arrow`, never a
# direct `arrow` dependency: a consumer that patches DataFusion to a fork
# would otherwise end up with two Arrows and a type mismatch at the seam.
datafusion = "54"
insta = { version = "1", features = ["filters"] }
lrlex = "0.13"
lrpar = "0.13"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
