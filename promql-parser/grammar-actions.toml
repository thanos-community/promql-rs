alt = "LEFT_PAREN number_duration_literal RIGHT_PAREN"
action = "Ok(())"

# --- duration-expression family ---
# Currently only the DURATION literal form inside matrix brackets is
# supported. The full duration-arithmetic tree (Prometheus 3.x
# experimental feature) parses but each non-literal alt returns Err(())
# at runtime. Filling these in is a follow-up once we decide whether
# to support `[5m+1m]`-style expressions.

[[actions]]
rule = "positive_duration_expr"
alt = "duration_expr"
action = "$1"

[[actions]]
rule = "duration_expr"
alt = "number_duration_literal"
action = "$1"

# Matrix selector now uses positive_duration_expr from upstream.
[[actions]]
rule = "matrix_selector"
alt = "expr LEFT_BRACKET positive_duration_expr RIGHT_BRACKET"
action = "actions::matrix_selector_from_expr($lexer, $span, $1, $3)"

# Subquery also takes positive_duration_expr + maybe a step.
[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, None)"

[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON duration_expr RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, Some($5))"

# Offset takes an offset_duration_expr in upstream.
[[actions]]
rule = "offset_expr"
alt = "expr OFFSET offset_duration_expr"
action = "actions::offset_from_expr($lexer, $1, $3)"

[[actions]]
rule = "offset_duration_expr"
alt = "duration_expr"
action = "$1"

[[actions]]
rule = "offset_duration_expr"
alt = "number_duration_literal"
action = "$1"

[[actions]]
rule = "offset_duration_expr"
alt = "unary_op number_duration_literal"
action = "actions::signed_duration($1, $2)"

# Two-argument subquery form: rate(foo[5m])[30m:1m].
[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET positive_duration_expr COLON positive_duration_expr RIGHT_BRACKET"
action = "actions::subquery_from_exprs($lexer, $span, $1, $3, Some($5))"

# string_identifier-style label matcher.
[[actions]]
