# we don't thread them through yet. Map every modifier alt to Ok(()) so
# the grammar parses; attaching the modifier semantics to the resulting
# BinaryExpr is a follow-up.

[[actions]]
rule = "bin_modifier"
alt = "fill_modifiers"
action = "$1"

[[actions]]
rule = "fill_modifiers"
alt = "group_modifiers"
action = "$1"

[[actions]]
