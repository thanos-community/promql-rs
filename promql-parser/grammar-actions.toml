# Sidecar for `promql-sync generate-grammar`.
#
# The generator reads `upstream/generated_parser.y` plus this file plus
# `grammar-tokens.toml` and rewrites `src/grammar.y`. Our source of
# truth for the *structure* of the grammar (rules, alternatives,
# precedence) is upstream; our contribution is the Rust action bodies
# and return types, kept here.
#
# Any alt that doesn't have a mapping below gets an `Err(())`
# placeholder (`unmapped_placeholder`) in the generated grammar. The
# CLI prints those as part of its report so you know what still needs
# a hand-written helper in `src/actions.rs`.

# Rust text appended after the second `%%` in the generated grammar.
# Keep in sync with the imports referenced by action bodies below.
epilogue = """
use crate::ast::{AtModifier, Expr, LabelMatcher, MatchOp};
use crate::token::ItemType;
use crate::actions;
"""

# grmtools `%start` symbol. Upstream's `start` rule dispatches across
# multiple parse modes via injected START_* pseudo-tokens; our lexer
# doesn't do that. `parse_metric_selector` already flows through
# `parse_expr`, so a single `expr` start covers everything we need.
start_symbol = "expr"

# Rules the generator traces reachability from. Only rules reachable
# from any of these are emitted — everything else is dead for us.
emit_roots = ["expr", "step_invariant_expr"]

# Upstream rules to skip entirely, plus anything they pull in. We
# don't port series descriptions, histogram descriptors, duration
# expressions (experimental), fill modifiers, or smoothed/anchored
# modifiers. `start` goes here because we bypass it via `expr`.
skip_rules = [
  "start",
  "series_description",
  "series_item",
  "series_values",
  "series_value",
  "histogram_desc_map",
  "histogram_desc_item",
  "histogram_series_value",
  "bucket_set",
  "bucket_set_list",
  "counter_reset_hint",
  "anchored_expr",
  "smoothed_expr",
]

# Body emitted for any alt that doesn't have a mapping. Must typecheck
# against every rule's declared return type — `Err(())` works for all
# `Result<_, ()>` rules, which covers every rule currently in scope.
unmapped_placeholder = "Err(())"

# Per-rule fallback action bodies. Applied to any alt of the named
# rule that lacks an explicit [[actions]] entry. Lets us one-line
# keyword-heavy rules like `maybe_label : AVG | BOOL | BOTTOMK | ...`
# where every alternative has the same action.
[default_actions]
# Any single-token keyword used as a label/metric name just needs its
# span text. Same action for every alternative.
maybe_label = "Ok(actions::span_str($lexer, $1.map_err(|_| ())?.span()).to_string())"
metric_identifier = "Ok(actions::span_str($lexer, $1.map_err(|_| ())?.span()).to_string())"

# ---------------------------------------------------------------
# Per-rule return types. Missing entries fall back to the default
# `Result<(), ()>` and the rule's alts get placeholder bodies.
# ---------------------------------------------------------------

[return_types]
start = "Result<Expr, ()>"
expr = "Result<Expr, ()>"
aggregate_expr = "Result<Expr, ()>"
aggregate_modifier = "Result<(bool, Vec<String>), ()>"
binary_expr = "Result<Expr, ()>"
bin_modifier = "Result<(), ()>"
bool_modifier = "Result<(), ()>"
on_or_ignoring = "Result<(), ()>"
group_modifiers = "Result<(), ()>"
fill_modifiers = "Result<(), ()>"
fill_value = "Result<(), ()>"
function_call = "Result<Expr, ()>"
function_call_args = "Result<Vec<Expr>, ()>"
function_call_body = "Result<Vec<Expr>, ()>"
matrix_selector = "Result<Expr, ()>"
number_duration_literal = "Result<Expr, ()>"
offset_expr = "Result<Expr, ()>"
anchored_expr = "Result<Expr, ()>"
smoothed_expr = "Result<Expr, ()>"
paren_expr = "Result<Expr, ()>"
string_literal = "Result<Expr, ()>"
subquery_expr = "Result<Expr, ()>"
unary_expr = "Result<Expr, ()>"
vector_selector = "Result<Expr, ()>"
step_invariant_expr = "Result<Expr, ()>"
duration_expr = "Result<Expr, ()>"
paren_duration_expr = "Result<Expr, ()>"
positive_duration_expr = "Result<Expr, ()>"
offset_duration_expr = "Result<Expr, ()>"
aggregate_op = "Result<ItemType, ()>"
grouping_label = "Result<String, ()>"
grouping_label_list = "Result<Vec<String>, ()>"
grouping_labels = "Result<Vec<String>, ()>"
maybe_grouping_labels = "Result<Vec<String>, ()>"
maybe_label = "Result<String, ()>"
match_op = "Result<MatchOp, ()>"
metric = "Result<Vec<LabelMatcher>, ()>"
metric_identifier = "Result<String, ()>"
string_identifier = "Result<String, ()>"
label_match_list = "Result<Vec<LabelMatcher>, ()>"
label_matcher = "Result<LabelMatcher, ()>"
label_matchers = "Result<Vec<LabelMatcher>, ()>"
label_set = "Result<Vec<LabelMatcher>, ()>"
label_set_list = "Result<Vec<LabelMatcher>, ()>"
label_set_item = "Result<LabelMatcher, ()>"
at_modifier_preprocessors = "Result<AtModifier, ()>"
unary_op = "Result<ItemType, ()>"
min_max = "Result<ItemType, ()>"
number = "Result<f64, ()>"
signed_number = "Result<f64, ()>"
signed_or_unsigned_number = "Result<f64, ()>"
int = "Result<i64, ()>"
uint = "Result<u64, ()>"

# ---------------------------------------------------------------
# Per-alt action bodies. Keyed by (rule LHS, upstream alt signature).
# `alt` is the upstream symbol sequence joined by single spaces; use
# upstream token names (LEFT_PAREN, not LPAREN) — the generator applies
# the rename table from grammar-tokens.toml before emitting.
# ---------------------------------------------------------------
#
# NOTE: this sidecar currently covers only a seed set. Unmapped alts
# produce `Err(())` placeholders so the grammar compiles; the generator
# lists them at the end of its output. Filling them in is a pass of
# looking at upstream's Go action body and writing the Rust equivalent
# in `src/actions.rs`, then adding an entry below.

[[actions]]
rule = "start"
alt = "START_EXPRESSION expr"
action = "$2"

[[actions]]
rule = "start"
alt = "START_METRIC_SELECTOR vector_selector"
action = "$2"

[[actions]]
rule = "expr"
alt = "aggregate_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "binary_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "function_call"
action = "$1"

[[actions]]
rule = "expr"
alt = "matrix_selector"
action = "$1"

[[actions]]
rule = "expr"
alt = "paren_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "string_literal"
action = "$1"

[[actions]]
rule = "expr"
alt = "subquery_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "unary_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "vector_selector"
action = "$1"

[[actions]]
rule = "expr"
alt = "offset_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "number_duration_literal"
action = "$1"

[[actions]]
rule = "expr"
alt = "step_invariant_expr"
action = "$1"

[[actions]]
rule = "expr"
alt = "duration_expr"
action = "$1"

# --- binary_expr: one alt per operator ---
# Upstream collapses operator precedence into %left/%right declarations
# with a single rule. Every alt has the same shape `expr OP bin_modifier expr`,
# so the action is uniform.

[[actions]]
rule = "binary_expr"
alt = "expr ADD bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr SUB bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr MUL bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr DIV bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr MOD bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr POW bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr ATAN2 bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr LAND bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr LOR bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr LUNLESS bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr EQLC bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr NEQ bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr LSS bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr LTE bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr GTR bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr GTE bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr TRIM_UPPER bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

[[actions]]
rule = "binary_expr"
alt = "expr TRIM_LOWER bin_modifier expr"
action = "actions::binary($lexer, $2.map_err(|_| ())?, $1, $4)"

# --- unary_expr ---

[[actions]]
rule = "unary_expr"
alt = "unary_op expr"
action = "actions::unary_from_token($lexer, $span, $1, $2)"

[[actions]]
rule = "unary_op"
alt = "ADD"
action = "Ok(ItemType::Add)"

[[actions]]
rule = "unary_op"
alt = "SUB"
action = "Ok(ItemType::Sub)"

# --- aggregate ---

[[actions]]
rule = "aggregate_expr"
alt = "aggregate_op aggregate_modifier function_call_body"
action = "actions::aggregate($lexer, $span, $1?, Some($2?), $3?)"

[[actions]]
rule = "aggregate_expr"
alt = "aggregate_op function_call_body aggregate_modifier"
action = "actions::aggregate($lexer, $span, $1?, Some($3?), $2?)"

[[actions]]
rule = "aggregate_expr"
alt = "aggregate_op function_call_body"
action = "actions::aggregate($lexer, $span, $1?, None, $2?)"

[[actions]]
rule = "aggregate_modifier"
alt = "BY grouping_labels"
action = "Ok((false, $2?))"

[[actions]]
rule = "aggregate_modifier"
alt = "WITHOUT grouping_labels"
action = "Ok((true, $2?))"

[[actions]]
rule = "aggregate_op"
alt = "AVG"
action = "Ok(ItemType::Avg)"
[[actions]]
rule = "aggregate_op"
alt = "BOTTOMK"
action = "Ok(ItemType::Bottomk)"
[[actions]]
rule = "aggregate_op"
alt = "COUNT"
action = "Ok(ItemType::Count)"
[[actions]]
rule = "aggregate_op"
alt = "COUNT_VALUES"
action = "Ok(ItemType::CountValues)"
[[actions]]
rule = "aggregate_op"
alt = "GROUP"
action = "Ok(ItemType::Group)"
[[actions]]
rule = "aggregate_op"
alt = "MAX"
action = "Ok(ItemType::Max)"
[[actions]]
rule = "aggregate_op"
alt = "MIN"
action = "Ok(ItemType::Min)"
[[actions]]
rule = "aggregate_op"
alt = "QUANTILE"
action = "Ok(ItemType::Quantile)"
[[actions]]
rule = "aggregate_op"
alt = "STDDEV"
action = "Ok(ItemType::Stddev)"
[[actions]]
rule = "aggregate_op"
alt = "STDVAR"
action = "Ok(ItemType::Stdvar)"
[[actions]]
rule = "aggregate_op"
alt = "SUM"
action = "Ok(ItemType::Sum)"
[[actions]]
rule = "aggregate_op"
alt = "TOPK"
action = "Ok(ItemType::Topk)"
[[actions]]
rule = "aggregate_op"
alt = "LIMITK"
action = "Ok(ItemType::Limitk)"
[[actions]]
rule = "aggregate_op"
alt = "LIMIT_RATIO"
action = "Ok(ItemType::LimitRatio)"

# --- grouping_label / grouping_labels ---

[[actions]]
rule = "grouping_labels"
alt = "LEFT_PAREN grouping_label_list RIGHT_PAREN"
action = "$2"

[[actions]]
rule = "grouping_labels"
alt = "LEFT_PAREN grouping_label_list COMMA RIGHT_PAREN"
action = "$2"

[[actions]]
rule = "grouping_labels"
alt = "LEFT_PAREN RIGHT_PAREN"
action = "Ok(Vec::new())"

[[actions]]
rule = "grouping_label_list"
alt = "grouping_label_list COMMA grouping_label"
action = "{ let mut v = $1?; v.push($3?); Ok(v) }"

[[actions]]
rule = "grouping_label_list"
alt = "grouping_label"
action = "Ok(vec![$1?])"

[[actions]]
rule = "grouping_label"
alt = "maybe_label"
action = "$1"

[[actions]]
rule = "grouping_label"
alt = "STRING"
action = "Ok(actions::string_literal_value($lexer, $1.map_err(|_| ())?.span())?)"

[[actions]]
rule = "maybe_label"
alt = "IDENTIFIER"
action = "Ok(actions::span_str($lexer, $1.map_err(|_| ())?.span()).to_string())"

[[actions]]
rule = "maybe_grouping_labels"
alt = "grouping_labels"
action = "$1"

# --- function_call + args ---

[[actions]]
rule = "function_call"
alt = "IDENTIFIER function_call_body"
action = "actions::function_call($lexer, $span, $1.map_err(|_| ())?, $2?)"

[[actions]]
rule = "function_call_body"
alt = "LEFT_PAREN function_call_args RIGHT_PAREN"
action = "$2"

[[actions]]
rule = "function_call_body"
alt = "LEFT_PAREN RIGHT_PAREN"
action = "Ok(Vec::new())"

[[actions]]
rule = "function_call_args"
alt = "function_call_args COMMA expr"
