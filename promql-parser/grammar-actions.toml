action = "Ok(vec![$1?])"

[[actions]]
rule = "label_matcher"
alt = "IDENTIFIER match_op STRING"
action = "actions::label_matcher($lexer, $span, $1.map_err(|_| ())?.span(), $2?, $3.map_err(|_| ())?)"

[[actions]]
rule = "label_matcher"
alt = "string_identifier match_op STRING"
