action = "actions::matrix_selector($lexer, $span, $1, $3.map_err(|_| ())?)"

[[actions]]
rule = "subquery_expr"
alt = "expr LEFT_BRACKET DURATION COLON DURATION RIGHT_BRACKET"
action = "actions::subquery($lexer, $span, $1, $3.map_err(|_| ())?, Some($5.map_err(|_| ())?))"

[[actions]]
