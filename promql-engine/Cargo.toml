[package]
name = "promql-engine"
version = "0.1.0"
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
description = "PromQL evaluation as DataFusion plans over a row-per-series Arrow seam"

[lib]
path = "src/lib.rs"
# `cargo bench` runs only the criterion targets below, not libtest's.
bench = false

[dependencies]
async-trait = { workspace = true }
datafusion = { workspace = true }
promql-parser = { path = "../promql-parser" }
regex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "kernels"
harness = false

[[bench]]
name = "engine"
harness = false
