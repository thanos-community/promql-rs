# Expected LogicalPlan per query, and for small cases the ExecutionPlan.
# See tests/plan.rs for what this is for and how to add a case.
#
# `defaults` is the one query range every case is planned with, so the
# literals in a plan never differ between cases. Field names follow the
# shared engine test-case format (thanos-io/promql-engine
# testcases/range_queries.yaml), with `plan` added.
#
# `load` is per case because the projection's schema is derived from the
# source's label names, sorted and deduplicated: the label set is part of
# what is being pinned. One sample per series is enough because nothing
# but the label set reaches the planner, and a second adds nothing; the
# loader rejects a series carrying more unless the case sets `chunked_ms`,
# where the samples decide how many batches the store hands over.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: instant selector
    description: >
      The selector is an aggregate grouped by the whole labels struct, so
      a label set split over several chunks is one group. The labels pass
      through untouched: an instant selector keeps every label it was
      given, __name__ included.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="api", pod="api-2"} 0
    query: |
      http_requests_total{job="api"}
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[1]

  - name: aggregation over an instant selector
    description: >
      An ungrouped sum stacks on the selector aggregate: two aggregates,
      the lower grouped by series, the upper by nothing.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum(http_requests_total)
    plan: |
      Projection: promql_labels() AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0

  - name: range function over a different label set
    description: >
      The range function is an aggregate grouped by the whole labels
      struct, like the selector. rate drops __name__, so the labels are
      rebuilt field by field above it: dropped below, two series differing
      only in their name would fold into one group. The fields named here
      are this case's own, which is what shows that the projection follows
      the data rather than a fixed schema.
    load:
      - node_cpu_seconds_total{cpu="0", instance="a", mode="idle"} 0
      - node_cpu_seconds_total{cpu="1", instance="a", mode="user"} 0
    query: |
      rate(node_cpu_seconds_total[5m])
    plan: |
      Projection: promql_labels(Utf8("cpu"), get_field(selector_0.labels, Utf8("cpu")), Utf8("instance"), get_field(selector_0.labels, Utf8("instance")), Utf8("mode"), get_field(selector_0.labels, Utf8("mode"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: promql_labels(Utf8("job"), __group__job) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, get_field(labels, Utf8("job")) AS __group__job]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0

  - name: count over time
    description: >
      A counting function takes the same aggregate as rate; only the
      function-name literal differs, so one registration serves the whole
      family.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      count_over_time(http_requests_total[10m])
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("count_over_time"), Int64(600000), Int64(1200000), Int64(30000), Int64(600000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: range function with an offset
    description: >
      The offset is a literal argument of the aggregate, in the slot an @
      fills too, so the shape does not change with either modifier.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] offset 5m)
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(300000), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: instant selector over chunks
    description: >
      The store hands each label set over as several chunks, each its own
      batch, which only the physical plan shows as the number of batches
      under SeriesSetExec. The logical plan is the whole-series case's: a
      label set split over chunks is still one group of the Sorted
      aggregate.
    chunked_ms: 150000
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      x
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[4]

  - name: range function over chunks in four partitions
    description: >
      Four store partitions, each series whole in one of them and chunked
      within it. Each partition's Partial folds its own series Sorted and
      emits them finished; a merge on labels hands them in order to one
      Final, which stays Sorted too.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      rate(x[5m])
    plan: |
      Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, get_field(labels@2, pod)) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation over chunks in four partitions
    description: >
      The rate aggregate runs SinglePartitioned per store partition. The
      projection above it computes the group key as a new expression, so
      Hash(labels) does not carry through it and the upper aggregate
      splits into a Partial per partition, a hash shuffle on the block
      columns and the group key, and a FinalPartitioned. The shuffle keeps
      block order, so the Final emits a block once every partition has
      passed it instead of holding every block to the end. Its width is
      the session's target_partitions, which the harness prints as a name.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: promql_labels(Utf8("pod"), __group__pod) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@2) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end, __group__pod@2 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end, __datafusion_extracted_1@3 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end, get_field(promql_labels(pod, get_field(labels@2, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation with every group in every partition
    description: >
      Sixteen series, eight per pod, spread so that both groups occur in
      every store partition: the shape is the same as with one series per
      pod, which is the point. Each Partial emits a partial sum per group
      it saw, and the shuffle brings a group's partials together.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a", i="0"} 1+1x19
      - x{pod="a", i="1"} 1+1x19
      - x{pod="a", i="2"} 1+1x19
      - x{pod="a", i="3"} 1+1x19
      - x{pod="a", i="4"} 1+1x19
      - x{pod="a", i="5"} 1+1x19
      - x{pod="a", i="6"} 1+1x19
      - x{pod="a", i="7"} 1+1x19
      - x{pod="b", i="0"} 2+3x19
      - x{pod="b", i="1"} 2+3x19
      - x{pod="b", i="2"} 2+3x19
      - x{pod="b", i="3"} 2+3x19
      - x{pod="b", i="4"} 2+3x19
      - x{pod="b", i="5"} 2+3x19
      - x{pod="b", i="6"} 2+3x19
      - x{pod="b", i="7"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: promql_labels(Utf8("pod"), __group__pod) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("i"), get_field(selector_0.labels, Utf8("i")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@2) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end, __group__pod@2 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end, __datafusion_extracted_1@3 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end, get_field(promql_labels(i, get_field(labels@2, i), pod, get_field(labels@2, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[6, 12, 8, 6]

  - name: ungrouped aggregation over chunks in four partitions
    description: >
      With no group key the block columns are still a key: a Partial per
      partition and a shuffle on the block, order kept, so each block's
      sum is final once every partition has passed it.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum(rate(x[5m]))
    plan: |
      Projection: promql_labels() AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[{} as labels, samples@2 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=Sorted
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=Sorted
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: instant selector over blocks and chunks
    description: >
      The store cuts the select into 200s blocks on top of 150s chunks,
      so a label set arrives in several blocks and each block in several
      chunks: the data ends at 570s, so the first block, reaching back
      from 600s by the lookback, holds two chunks per series, the second
      one, and the two after it nothing. The plan is the one-block
      case's: the block is a group key the store fills, and the number of
      batches is all that grows.
    chunked_ms: 150000
    blocks_ms: 200000
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      x
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[6]

  - name: range function with an offset of an hour
    description: >
      offset is PromQL's own selector modifier and prints attached to the
      column it modifies, inside the call's parentheses rather than as a
      trailing argument.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] offset 1h)
    plan: |
      Projection: labels{job, pod}, rate(samples[5m] offset 1h, 600000..1200000 step 30s)
        TableScan: http_requests_total

  - name: without resolves to the remaining keys at plan time
    description: >
      The planner turns without (pod) into by over whatever labels are
      left, so the plan only ever holds a by clause: this pins that
      sum by (job) is what without (pod) actually plans to, not a
      without-shaped node the renderer would need to reconstruct.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum without (pod) (rate(http_requests_total[5m]))
    plan: |
      Projection: labels{job: __group__job}
        Aggregate: sum by (job) (samples, 600000..1200000 step 30s)
          Projection: labels{job, pod}, rate(samples[5m], 600000..1200000 step 30s)
            TableScan: http_requests_total

  - name: an at modifier on a range function
    description: >
      @ takes seconds in PromQL but the plan carries milliseconds, so the
      pin shows the raw resolved timestamp the plan holds rather than the
      query's own units.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] @ 900)
    plan: |
      Projection: labels{job, pod}, rate(samples[5m] @ 900000, 600000..1200000 step 30s)
        TableScan: http_requests_total
