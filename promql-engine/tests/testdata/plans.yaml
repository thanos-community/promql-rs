# Expected LogicalPlan per query, and for small cases the ExecutionPlan.
# See tests/plan.rs for what this is for and how to add a case.
#
# `defaults` is the one query range every case is planned with, so the
# literals in a plan never differ between cases. Field names follow the
# shared engine test-case format (thanos-io/promql-engine
# testcases/range_queries.yaml), with `plan` added.
#
# `load` is per case because the projection's schema is derived from the
# source's label names, sorted and deduplicated: the label set is part of
# what is being pinned. One sample per series is enough because nothing
# but the label set reaches the planner, and a second adds nothing; the
# loader rejects a series carrying more unless the case sets `chunked_ms`,
# where the samples decide how many batches the store hands over.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: instant selector
    description: >
      The selector is an aggregate grouped by the whole labels struct, so
      a series split over several chunk rows is one group. The labels pass
      through untouched: an instant selector keeps every label it was
      given, __name__ included.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="api", pod="api-2"} 0
    query: |
      http_requests_total{job="api"}
    plan: |
      Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
        TableScan: selector_0
    physical: |
      AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
        SeriesSetExec
          DataSourceExec: partitions=1, partition_sizes=[1]

  - name: aggregation over an instant selector
    description: >
      An ungrouped sum stacks on the selector aggregate: two aggregates,
      the lower grouped by series, the upper by nothing.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum(http_requests_total)
    plan: |
      Projection: promql_labels() AS labels, samples
        Aggregate: groupBy=[[]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
            TableScan: selector_0

  - name: range function over a different label set
    description: >
      The range function is an aggregate grouped by the whole labels
      struct, like the selector. rate drops __name__, so the labels are
      rebuilt field by field above it: dropped below, two series differing
      only in their name would fold into one group. The fields named here
      are this case's own, which is what shows that the projection follows
      the data rather than a fixed schema.
    load:
      - node_cpu_seconds_total{cpu="0", instance="a", mode="idle"} 0
      - node_cpu_seconds_total{cpu="1", instance="a", mode="user"} 0
    query: |
      rate(node_cpu_seconds_total[5m])
    plan: |
      Projection: promql_labels(Utf8("cpu"), get_field(selector_0.labels, Utf8("cpu")), Utf8("instance"), get_field(selector_0.labels, Utf8("instance")), Utf8("mode"), get_field(selector_0.labels, Utf8("mode"))) AS labels, samples
        Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: promql_labels(Utf8("job"), __group__job) AS labels, samples
        Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
            Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0

  - name: count over time
    description: >
      A counting function takes the same aggregate as rate; only the
      function-name literal differs, so one registration serves the whole
      family.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      count_over_time(http_requests_total[10m])
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
        Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("count_over_time"), Int64(600000), Int64(1200000), Int64(30000), Int64(600000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: range function with an offset
    description: >
      The offset is a literal argument of the aggregate, in the slot an @
      fills too, so the shape does not change with either modifier.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] offset 5m)
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
        Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(300000), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: instant selector over chunk rows
    description: >
      The store hands each series over as several chunk rows, each its own
      batch, which only the physical plan shows as the number of batches
      under SeriesSetExec. The logical plan is the one-row case's: a
      series split over chunk rows is still one group of the Sorted
      aggregate.
    chunked_ms: 150000
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      x
    plan: |
      Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
        TableScan: selector_0
    physical: |
      AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
        SeriesSetExec
          DataSourceExec: partitions=1, partition_sizes=[4]

  - name: range function over chunk rows in four partitions
    description: >
      Four store partitions, each series whole in one of them and chunked
      within it. SeriesSetExec declares that as Hash(labels), so the
      aggregate grouped by labels needs no shuffle: one SinglePartitioned
      aggregate per partition folds its own series Sorted and emits them
      finished, with no merge and no Final.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      rate(x[5m])
    plan: |
      Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
        Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, get_field(labels@0, pod)) as labels, samples@1 as samples]
        AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_range_function(selector_0.samples, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation over chunk rows in four partitions
    description: >
      The rate aggregate runs SinglePartitioned per store partition. The
      projection above it computes the group key as a new expression, so
      Hash(labels) does not carry through it and the upper aggregate
      splits into a Partial per partition, a hash shuffle on the group key
      and a FinalPartitioned. The shuffle's width is the session's
      target_partitions, which the harness prints as a name.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: promql_labels(Utf8("pod"), __group__pod) AS labels, samples
        Aggregate: groupBy=[[get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
            Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@0) as labels, samples@1 as samples]
        AggregateExec: mode=FinalPartitioned, gby=[__group__pod@0 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
          RepartitionExec: partitioning=Hash([__group__pod@0], target_partitions), input_partitions=4
            AggregateExec: mode=Partial, gby=[__datafusion_extracted_1@1 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
              ProjectionExec: expr=[samples@1 as samples, get_field(promql_labels(pod, get_field(labels@0, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_range_function(selector_0.samples, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation with every group in every partition
    description: >
      Sixteen series, eight per pod, spread so that both groups occur in
      every store partition: the shape is the same as with one series per
      pod, which is the point. Each Partial emits a partial sum per group
      it saw, and the shuffle brings a group's partials together.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a", i="0"} 1+1x19
      - x{pod="a", i="1"} 1+1x19
      - x{pod="a", i="2"} 1+1x19
      - x{pod="a", i="3"} 1+1x19
      - x{pod="a", i="4"} 1+1x19
      - x{pod="a", i="5"} 1+1x19
      - x{pod="a", i="6"} 1+1x19
      - x{pod="a", i="7"} 1+1x19
      - x{pod="b", i="0"} 2+3x19
      - x{pod="b", i="1"} 2+3x19
      - x{pod="b", i="2"} 2+3x19
      - x{pod="b", i="3"} 2+3x19
      - x{pod="b", i="4"} 2+3x19
      - x{pod="b", i="5"} 2+3x19
      - x{pod="b", i="6"} 2+3x19
      - x{pod="b", i="7"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: promql_labels(Utf8("pod"), __group__pod) AS labels, samples
        Aggregate: groupBy=[[get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("i"), get_field(selector_0.labels, Utf8("i")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
            Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@0) as labels, samples@1 as samples]
        AggregateExec: mode=FinalPartitioned, gby=[__group__pod@0 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
          RepartitionExec: partitioning=Hash([__group__pod@0], target_partitions), input_partitions=4
            AggregateExec: mode=Partial, gby=[__datafusion_extracted_1@1 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
              ProjectionExec: expr=[samples@1 as samples, get_field(promql_labels(i, get_field(labels@0, i), pod, get_field(labels@0, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_range_function(selector_0.samples, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[6, 12, 8, 6]

  - name: ungrouped aggregation over chunk rows in four partitions
    description: >
      With no group key there is nothing to shuffle on: a Partial per
      partition, a coalesce, one Final.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum(rate(x[5m]))
    plan: |
      Projection: promql_labels() AS labels, samples
        Aggregate: groupBy=[[]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples
            Aggregate: groupBy=[[selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0
    physical: |
      ProjectionExec: expr=[{} as labels, samples@0 as samples]
        AggregateExec: mode=Final, gby=[], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
          CoalescePartitionsExec
            AggregateExec: mode=Partial, gby=[], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples]
              ProjectionExec: expr=[samples@1 as samples]
                AggregateExec: mode=SinglePartitioned, gby=[labels@0 as labels], aggr=[promql_range_function(selector_0.samples, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]
