# Expected LogicalPlan per query, and for small cases the ExecutionPlan.
# See tests/plan.rs for what this is for and how to add a case.
#
# `defaults` is the one query range every case is planned with, so the
# literals in a plan never differ between cases. Field names follow the
# shared engine test-case format (thanos-io/promql-engine
# testcases/range_queries.yaml), with `plan` added.
#
# `load` is per case because the projection's schema is derived from the
# source's label names, sorted and deduplicated: the label set is part of
# what is being pinned. One sample per series is enough because nothing
# but the label set reaches the planner, and a second adds nothing; the
# loader rejects a series carrying more unless the case sets `chunked_ms`,
# where the samples decide how many batches the store hands over.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: instant selector
    description: >
      The selector is an aggregate grouped by the whole labels struct, so
      a label set split over several chunks is one group. The labels pass
      through untouched: an instant selector keeps every label it was
      given, __name__ included.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="api", pod="api-2"} 0
    query: |
      http_requests_total{job="api"}
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=Single, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[1]

  - name: aggregation over an instant selector
    description: >
      An ungrouped sum stacks on the selector aggregate: two aggregates,
      the lower grouped by series, the upper by nothing.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum(http_requests_total)
    plan: |
      Projection: promql_labels() AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0

  - name: range function over a different label set
    description: >
      The range function is an aggregate grouped by the whole labels
      struct, like the selector. rate drops __name__, so the labels are
      rebuilt field by field above it: dropped below, two series differing
      only in their name would fold into one group. The fields named here
      are this case's own, which is what shows that the projection follows
      the data rather than a fixed schema.
    load:
      - node_cpu_seconds_total{cpu="0", instance="a", mode="idle"} 0
      - node_cpu_seconds_total{cpu="1", instance="a", mode="user"} 0
    query: |
      rate(node_cpu_seconds_total[5m])
    plan: |
      Projection: promql_labels(Utf8("cpu"), get_field(selector_0.labels, Utf8("cpu")), Utf8("instance"), get_field(selector_0.labels, Utf8("instance")), Utf8("mode"), get_field(selector_0.labels, Utf8("mode"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: promql_labels(Utf8("job"), __group__job) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, get_field(labels, Utf8("job")) AS __group__job]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
            Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
              TableScan: selector_0

  - name: count over time
    description: >
      A counting function takes the same aggregate as rate; only the
      function-name literal differs, so one registration serves the whole
      family.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      count_over_time(http_requests_total[10m])
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("count_over_time"), Int64(600000), Int64(1200000), Int64(30000), Int64(600000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: range function with an offset
    description: >
      The offset is a literal argument of the aggregate, in the slot an @
      fills too, so the shape does not change with either modifier.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] offset 5m)
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(300000), Int64(NULL)) AS samples]]
          TableScan: selector_0

  - name: instant selector over chunks
    description: >
      The store hands each label set over as several chunks, each its own
      batch, which only the physical plan shows as the number of batches
      under SeriesSetExec. The logical plan is the whole-series case's: a
      label set split over chunks is still one group of the Sorted
      aggregate.
    chunked_ms: 150000
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      x
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=Single, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[4]

  - name: range function over chunks in four partitions
    description: >
      Four store partitions, each series whole in one of them and chunked
      within it. Each partition's Partial folds its own series Sorted and
      emits them finished; a merge on labels hands them in order to one
      Final, which stays Sorted too.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      rate(x[5m])
    plan: |
      Projection: promql_labels(Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[promql_labels(pod, get_field(labels@2, pod)) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=Final, gby=[block_start@0 as block_start, block_end@1 as block_end, labels@2 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SortPreservingMergeExec: [block_start@0 ASC, block_end@1 ASC, labels@2 ASC]
            AggregateExec: mode=Partial, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
              SeriesSetExec
                DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: instant selector over blocks and chunks
    description: >
      The store cuts the select into 200s blocks on top of 150s chunks,
      so a label set arrives in several blocks and each block in several
      chunks: the data ends at 570s, so the first block, reaching back
      from 600s by the lookback, holds two chunks per series, the second
      one, and the two after it nothing. The plan is the one-block
      case's: the block is a group key the store fills, and the number of
      batches is all that grows.
    chunked_ms: 150000
    blocks_ms: 200000
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      x
    plan: |
      Projection: selector_0.labels, samples, selector_0.block_start, selector_0.block_end
        Aggregate: groupBy=[[selector_0.block_start, selector_0.block_end, selector_0.labels]], aggr=[[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples]]
          TableScan: selector_0
    physical: |
      ProjectionExec: expr=[labels@2 as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=Single, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_vector_selector(selector_0.samples, selector_0.block_start, selector_0.block_end, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
          SeriesSetExec
            DataSourceExec: partitions=1, partition_sizes=[6]
