# Expected LogicalPlan per query. See tests/plan.rs for what this is for
# and how to add a case.
#
# `defaults` is the one query range every case is planned with, so the
# literals in a plan never differ between cases. Field names follow the
# shared engine test-case format (thanos-io/promql-engine
# testcases/range_queries.yaml), with `plan` added.
#
# `load` is per case because the projection's schema is derived from the
# source's label names, sorted and deduplicated: the label set is part of
# what is being pinned. One sample per series is enough because nothing
# but the label set reaches the planner, and a second adds nothing; the
# loader rejects a series carrying more.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: instant selector
    description: >
      The labels pass through untouched as one struct: an instant
      selector keeps every label it was given, __name__ included.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="api", pod="api-2"} 0
    query: |
      http_requests_total{job="api"}
    plan: |
      Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
        TableScan: selector_0

  - name: range function over a different label set
    description: >
      rate drops __name__, so the labels are rebuilt field by field. The
      fields named here are this case's own, which is what shows that the
      projection follows the data rather than a fixed schema.
    load:
      - node_cpu_seconds_total{cpu="0", instance="a", mode="idle"} 0
      - node_cpu_seconds_total{cpu="1", instance="a", mode="user"} 0
    query: |
      rate(node_cpu_seconds_total[5m])
    plan: |
      Projection: promql_labels(Utf8("cpu"), get_field(selector_0.labels, Utf8("cpu")), Utf8("instance"), get_field(selector_0.labels, Utf8("instance")), Utf8("mode"), get_field(selector_0.labels, Utf8("mode"))) AS labels, promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
        TableScan: selector_0

  - name: an elementwise function over a selector
    description: >
      One projection per function, each over the last: the operator
      changes only the value, so the shape it runs on is the shape it
      hands back. The subquery alias is what keeps the inner `labels`
      and the rebuilt one apart when the two projections are merged.
    load:
      - temperature{city="oslo"} 0
    query: |
      abs(temperature)
    plan: |
      Projection: promql_labels(Utf8("city"), get_field(abs_0.labels, Utf8("city"))) AS labels, promql_elementwise(abs_0.samples, Utf8("abs"), Float64(NULL), Float64(NULL)) AS samples
        SubqueryAlias: abs_0
          Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
            TableScan: selector_0

  - name: vector of a scalar
    description: >
      vector(s) asks no store: it is the scalar's value under an empty
      label set, which is the table a scalar plan already is.
    load:
      - temperature{city="oslo"} 0
    query: |
      vector(time())
    plan: |
      TableScan: scalar_0

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: promql_labels(Utf8("job"), __group__job) AS labels, samples
        Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job]], aggr=[[promql_aggregate(samples, Utf8("sum"), Int64(600000), Int64(1200000), Int64(30000)) AS samples]]
          Projection: promql_labels(Utf8("job"), get_field(selector_0.labels, Utf8("job")), Utf8("pod"), get_field(selector_0.labels, Utf8("pod"))) AS labels, promql_range_function(selector_0.samples, Utf8("rate"), Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
            TableScan: selector_0

  - name: a vector against a scalar
    description: >
      The scalar is folded while planning, so the operator is the
      elementwise kernel with one operand already a number and no
      second input at all. __name__ is rebuilt away, as it is for any
      arithmetic.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
    query: |
      http_requests_total * 2
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod"))) AS labels, promql_elementwise(binary_0.samples, Utf8("*"), Float64(2), Float64(NULL)) AS samples
        SubqueryAlias: binary_0
          Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
            TableScan: selector_0

  - name: a scalar on the left of a vector
    description: >
      Which side the scalar was written on survives as which argument
      slot it lands in: upstream's swap, and the only thing that
      separates this plan from the one above.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
    query: |
      600 / http_requests_total
    plan: |
      Projection: promql_labels(Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod"))) AS labels, promql_elementwise(binary_0.samples, Utf8("/"), Float64(NULL), Float64(600)) AS samples
        SubqueryAlias: binary_0
          Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
            TableScan: selector_0

  - name: a comparison between two vectors
    description: >
      A comparison without bool answers with the left sample as it
      stood, __name__ and all — and __name__ is the one label the match
      signature leaves out. So the aggregation builds the result labels
      itself and answers with a series per label set rather than one
      per match group; the two Unnest nodes open that list into a row
      each.
    load:
      - requests{job="api", pod="api-1"} 0
      - errors{job="api", pod="api-1"} 0
    query: |
      requests > errors
    plan: |
      Projection: __pairs__.labels AS labels, __pairs__.samples AS samples
        Unnest: lists[] structs[__pairs__]
          Unnest: lists[__pairs__|depth=1] structs[]
            Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job, get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_binary(samples, __rhs, labels, Utf8(">"), Utf8(""), Int64(600000), Int64(1200000), Int64(30000)) AS __pairs__]]
              Union
                Projection: promql_labels(Utf8("__name__"), get_field(binary_0.labels, Utf8("__name__")), Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod"))) AS labels, binary_0.samples, Boolean(false) AS __rhs
                  SubqueryAlias: binary_0
                    Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_0
                Projection: promql_labels(Utf8("__name__"), get_field(binary_1.labels, Utf8("__name__")), Utf8("job"), get_field(binary_1.labels, Utf8("job")), Utf8("pod"), get_field(binary_1.labels, Utf8("pod"))) AS labels, binary_1.samples, Boolean(true) AS __rhs
                  SubqueryAlias: binary_1
                    Projection: selector_1.labels, promql_vector_selector(selector_1.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_1
  - name: two vectors matched one to one
    description: >
      Both sides widened to one label schema, unioned, and grouped by
      the match signature — which for default matching is the result's
      own label set. A label only one side carries is read as the empty
      string on the other, which is how the shape spells absent.
    load:
      - requests{job="api", pod="api-1"} 0
      - errors{job="api", zone="eu"} 0
    query: |
      requests / errors
    plan: |
      Projection: __pairs__.labels AS labels, __pairs__.samples AS samples
        Unnest: lists[] structs[__pairs__]
          Unnest: lists[__pairs__|depth=1] structs[]
            Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job, get_field(labels, Utf8("pod")) AS __group__pod, get_field(labels, Utf8("zone")) AS __group__zone]], aggr=[[promql_binary(samples, __rhs, labels, Utf8("/"), Utf8(""), Int64(600000), Int64(1200000), Int64(30000)) AS __pairs__]]
              Union
                Projection: promql_labels(Utf8("__name__"), get_field(binary_0.labels, Utf8("__name__")), Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod")), Utf8("zone"), Utf8("")) AS labels, binary_0.samples, Boolean(false) AS __rhs
                  SubqueryAlias: binary_0
                    Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_0
                Projection: promql_labels(Utf8("__name__"), get_field(binary_1.labels, Utf8("__name__")), Utf8("job"), get_field(binary_1.labels, Utf8("job")), Utf8("pod"), Utf8(""), Utf8("zone"), get_field(binary_1.labels, Utf8("zone"))) AS labels, binary_1.samples, Boolean(true) AS __rhs
                  SubqueryAlias: binary_1
                    Projection: selector_1.labels, promql_vector_selector(selector_1.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_1
  - name: a fan-out matched on one label
    description: >
      on(job) makes the signature one column rather than every label
      the two sides share, and group_left(zone) says the left may be
      many. Neither shows in the plan's shape: the modifiers ride into
      the aggregation as their own PromQL spelling, because which
      series pair and which labels survive is one decision and it is
      made where the rows meet.
    load:
      - requests{job="api", pod="api-1"} 0
      - limit{job="api", zone="eu"} 0
    query: |
      requests / on(job) group_left(zone) limit
    plan: |
      Projection: __pairs__.labels AS labels, __pairs__.samples AS samples
        Unnest: lists[] structs[__pairs__]
          Unnest: lists[__pairs__|depth=1] structs[]
            Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job]], aggr=[[promql_binary(samples, __rhs, labels, Utf8("/"), Utf8("on(job) group_left(zone)"), Int64(600000), Int64(1200000), Int64(30000)) AS __pairs__]]
              Union
                Projection: promql_labels(Utf8("__name__"), get_field(binary_0.labels, Utf8("__name__")), Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod")), Utf8("zone"), Utf8("")) AS labels, binary_0.samples, Boolean(false) AS __rhs
                  SubqueryAlias: binary_0
                    Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_0
                Projection: promql_labels(Utf8("__name__"), get_field(binary_1.labels, Utf8("__name__")), Utf8("job"), get_field(binary_1.labels, Utf8("job")), Utf8("pod"), Utf8(""), Utf8("zone"), get_field(binary_1.labels, Utf8("zone"))) AS labels, binary_1.samples, Boolean(true) AS __rhs
                  SubqueryAlias: binary_1
                    Projection: selector_1.labels, promql_vector_selector(selector_1.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_1
  - name: a filtering comparison as an operand
    description: >
      The inner comparison keeps every label, __name__ included, and
      still rebuilds the struct rather than passing the column through.
      A passed-through column keeps the qualifier of the stage below
      it, so this branch of the union would answer with binary_0.labels
      where the other answers with labels, and the union would be
      ambiguous. The promql_labels call that copies every field across
      is what makes the name plain again.
    load:
      - requests{job="api", pod="api-1"} 0
      - errors{job="api", pod="api-1"} 0
    query: |
      (requests > 100) + errors
    plan: |
      Projection: __pairs__.labels AS labels, __pairs__.samples AS samples
        Unnest: lists[] structs[__pairs__]
          Unnest: lists[__pairs__|depth=1] structs[]
            Aggregate: groupBy=[[get_field(labels, Utf8("job")) AS __group__job, get_field(labels, Utf8("pod")) AS __group__pod]], aggr=[[promql_binary(samples, __rhs, labels, Utf8("+"), Utf8(""), Int64(600000), Int64(1200000), Int64(30000)) AS __pairs__]]
              Union
                Projection: promql_labels(Utf8("__name__"), get_field(binary_1.labels, Utf8("__name__")), Utf8("job"), get_field(binary_1.labels, Utf8("job")), Utf8("pod"), get_field(binary_1.labels, Utf8("pod"))) AS labels, binary_1.samples, Boolean(false) AS __rhs
                  SubqueryAlias: binary_1
                    Projection: promql_labels(Utf8("__name__"), get_field(binary_0.labels, Utf8("__name__")), Utf8("job"), get_field(binary_0.labels, Utf8("job")), Utf8("pod"), get_field(binary_0.labels, Utf8("pod"))) AS labels, promql_elementwise(binary_0.samples, Utf8(">"), Float64(100), Float64(NULL)) AS samples
                      SubqueryAlias: binary_0
                        Projection: selector_0.labels, promql_vector_selector(selector_0.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                          TableScan: selector_0
                Projection: promql_labels(Utf8("__name__"), get_field(binary_2.labels, Utf8("__name__")), Utf8("job"), get_field(binary_2.labels, Utf8("job")), Utf8("pod"), get_field(binary_2.labels, Utf8("pod"))) AS labels, binary_2.samples, Boolean(true) AS __rhs
                  SubqueryAlias: binary_2
                    Projection: selector_1.labels, promql_vector_selector(selector_1.samples, Int64(600000), Int64(1200000), Int64(30000), Int64(300000), Int64(0), Int64(NULL)) AS samples
                      TableScan: selector_1
