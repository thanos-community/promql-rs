# Plan pins for the topic of promql-conformance/testdata/prometheus/at_modifier.test.
# tests/plan.rs says what a case holds and how to add one.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: an at modifier on a range function
    description: >
      @ takes seconds in PromQL but the plan carries milliseconds, so the
      pin shows the raw resolved timestamp the plan holds rather than the
      query's own units.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      rate(http_requests_total[5m] @ 900)
    plan: |
      Projection: labels{job, pod}
        SeriesEval: rate(samples[5m] @ 900000, 600000..1200000 step 30s) per series per block
          TableScan: http_requests_total

  - name: an at modifier on predict linear
    description: >
      @ pins the sample window on the SeriesEval while the scalar horizon
      stays beside it. The runtime still reanchors the regression on each
      evaluation step; the plan only records the pinned window.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      predict_linear(http_requests_total[5m] @ 900, 3600)
    plan: |
      Projection: labels{job, pod}
        SeriesEval: predict_linear(samples[5m] @ 900000, 3600, 600000..1200000 step 30s) per series per block
          TableScan: http_requests_total
