# Plan pins for the topic of promql-conformance/testdata/prometheus/aggregators.test.
# tests/plan.rs says what a case holds and how to add one.
defaults:
  start_ms: 600000
  end_ms: 1200000
  step_ms: 30000

tests:
  - name: aggregation over an instant selector
    description: >
      An ungrouped sum stacks on the selector aggregate: two aggregates,
      the lower grouped by series, the upper by nothing.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum(http_requests_total)
    plan: |
      Projection: labels{}
        Aggregate: sum(samples, 600000..1200000 step 30s) per block
          Projection: labels, samples, block_start, block_end
            Aggregate: vector_selector(samples, 600000..1200000 step 30s, lookback 5m) per series per block
              TableScan: http_requests_total

  - name: grouped aggregation over a range function
    description: >
      by (job) becomes an ordinary DataFusion Aggregate, so grouping and
      the two-phase split are the engine's rather than hand-rolled. Only
      the grouped label survives into the top projection.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum by (job) (rate(http_requests_total[5m]))
    plan: |
      Projection: labels{job: __group__job}
        Aggregate: sum by (job) (samples, 600000..1200000 step 30s) per block
          Projection: labels{job, pod}
            Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: http_requests_total

  - name: grouped aggregation over chunks in four partitions
    description: >
      The rate aggregate runs SinglePartitioned per store partition. The
      projection above it computes the group key as a new expression, so
      Hash(labels) does not carry through it and the upper aggregate
      splits into a Partial per partition, a hash shuffle on the block
      columns and the group key, and a FinalPartitioned. The shuffle keeps
      block order, so the Final emits a block once every partition has
      passed it instead of holding every block to the end. Its width is
      the session's target_partitions, which the harness prints as a name.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: labels{pod: __group__pod}
        Aggregate: sum by (pod) (samples, 600000..1200000 step 30s) per block
          Projection: labels{pod}
            Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@2) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end, __group__pod@2 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end, __datafusion_extracted_1@3 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end, get_field(promql_labels(pod, get_field(labels@2, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: grouped aggregation with every group in every partition
    description: >
      Sixteen series, eight per pod, spread so that both groups occur in
      every store partition: the shape is the same as with one series per
      pod, which is the point. Each Partial emits a partial sum per group
      it saw, and the shuffle brings a group's partials together.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a", i="0"} 1+1x19
      - x{pod="a", i="1"} 1+1x19
      - x{pod="a", i="2"} 1+1x19
      - x{pod="a", i="3"} 1+1x19
      - x{pod="a", i="4"} 1+1x19
      - x{pod="a", i="5"} 1+1x19
      - x{pod="a", i="6"} 1+1x19
      - x{pod="a", i="7"} 1+1x19
      - x{pod="b", i="0"} 2+3x19
      - x{pod="b", i="1"} 2+3x19
      - x{pod="b", i="2"} 2+3x19
      - x{pod="b", i="3"} 2+3x19
      - x{pod="b", i="4"} 2+3x19
      - x{pod="b", i="5"} 2+3x19
      - x{pod="b", i="6"} 2+3x19
      - x{pod="b", i="7"} 2+3x19
    query: |
      sum by (pod) (rate(x[5m]))
    plan: |
      Projection: labels{pod: __group__pod}
        Aggregate: sum by (pod) (samples, 600000..1200000 step 30s) per block
          Projection: labels{i, pod}
            Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[promql_labels(pod, __group__pod@2) as labels, samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end, __group__pod@2 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1, __group__pod@2], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end, __datafusion_extracted_1@3 as __group__pod], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=PartiallySorted([0, 1])
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end, get_field(promql_labels(i, get_field(labels@2, i), pod, get_field(labels@2, pod)), pod) as __datafusion_extracted_1]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[6, 12, 8, 6]

  - name: ungrouped aggregation over chunks in four partitions
    description: >
      With no group key the block columns are still a key: a Partial per
      partition and a shuffle on the block, order kept, so each block's
      sum is final once every partition has passed it.
    chunked_ms: 150000
    partitions: 4
    load:
      - x{pod="a"} 1+1x19
      - x{pod="b"} 2+3x19
    query: |
      sum(rate(x[5m]))
    plan: |
      Projection: labels{}
        Aggregate: sum(samples, 600000..1200000 step 30s) per block
          Projection: labels{pod}
            Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: x
    physical: |
      ProjectionExec: expr=[{} as labels, samples@2 as samples, block_start@0 as block_start, block_end@1 as block_end]
        AggregateExec: mode=FinalPartitioned, gby=[block_start@0 as block_start, block_end@1 as block_end], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=Sorted
          RepartitionExec: partitioning=Hash([block_start@0, block_end@1], target_partitions), input_partitions=4, preserve_order=true, sort_exprs=block_start@0 ASC, block_end@1 ASC
            AggregateExec: mode=Partial, gby=[block_start@1 as block_start, block_end@2 as block_end], aggr=[promql_aggregate(samples, sum, 600000, 1200000, 30000) as samples], ordering_mode=Sorted
              ProjectionExec: expr=[samples@3 as samples, block_start@0 as block_start, block_end@1 as block_end]
                AggregateExec: mode=SinglePartitioned, gby=[block_start@2 as block_start, block_end@3 as block_end, labels@0 as labels], aggr=[promql_range_function(selector_0.samples, selector_0.block_start, selector_0.block_end, rate, 600000, 1200000, 30000, 300000, 0, NULL) as samples], ordering_mode=Sorted
                  SeriesSetExec
                    DataSourceExec: partitions=4, partition_sizes=[2, 2, 0, 0]

  - name: without resolves to the remaining keys at plan time
    description: >
      The planner turns without (pod) into by over whatever labels are
      left, so the plan only ever holds a by clause: this pins that
      sum by (job) is what without (pod) actually plans to, not a
      without-shaped node the renderer would need to reconstruct.
    load:
      - http_requests_total{job="api", pod="api-1"} 0
      - http_requests_total{job="web", pod="web-1"} 0
    query: |
      sum without (pod) (rate(http_requests_total[5m]))
    plan: |
      Projection: labels{job: __group__job}
        Aggregate: sum by (job) (samples, 600000..1200000 step 30s) per block
          Projection: labels{job, pod}
            Aggregate: rate(samples[5m], 600000..1200000 step 30s) per series per block
              TableScan: http_requests_total
